services:
  twinbench:
    build: .
    ports:
      - "43145:43145"
    environment:
      - CESIUM_ION_TOKEN=${CESIUM_ION_TOKEN:-}
      - CESIUM_ION_ASSET_ID=${CESIUM_ION_ASSET_ID:-}
      - DEFAULT_TILESET_URL=${DEFAULT_TILESET_URL:-}
    volumes:
      # Optional local 3D Tiles payload (serve via URL elsewhere or future static route)
      - ./data/tiles:/app/data/tiles:ro
    restart: unless-stopped
